<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="" id="registration-form">
            <h1>Register</h1>
            <!--* User Name -->
            <div class="form-group">
                <label for="UserName">Username</label>
                <input type="text" id="UserName" placeholder="Enter your Username"></input>
                <small>Username is required</small>
            </div>
            <!--* Email -->
            <div class="form-group">
                <label for="Email">Email</label>
                <input type="email" id="Email" placeholder="Enter your Email"></input>
                <small>Valid email is required</small>
            </div>
            <!--* PhoneNumber -->
            <div class="form-group">
                <label for="PhoneNumber">Phone Number</label>
                <input type="number" id="PhoneNumber" placeholder="Enter your Phone Number"></input>
                <small>Phone number is required</small>
            </div>
                <!--* Password -->
                <div class="form-group">
                    <label for="Password">Password</label>
                    <input type="password" id="Password" placeholder="Enter your Password"></input>
                    <small>Password is required</small>
                </div>
                <!--* ConfirmPassword -->
                <div class="form-group">
                    <label for="ConfirmPassword">ConfirmPassword</label>
                    <input type="password" id="ConfirmPassword" placeholder="Confirm Your Password"></input>
                    <small>Passwords do not match</small>
                </div>
                <button type="submit">Register</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
